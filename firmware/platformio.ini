; walkie firmware for the M5StickS3. It lives in app1 (ota_1); on-the-beat keeps app0.
; `pio run -t upload` is routed to tools/flash.mjs (app1 only); guard.py refuses -t erase/uploadfs. Never `pio test` against the S3.
[env:sticks3]
upload_protocol = custom
upload_command = node "$PROJECT_DIR/../tools/flash.mjs" --skip-build
extra_scripts = pre:guard.py
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  m5stack/M5Unified@0.2.23
  m5stack/M5GFX@0.2.30
